AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Spring Boot Demo Application on AWS Lambda

Parameters:
  Stage:
    Type: String
    Default: dev
    Description: Stage name for the deployment

Resources:
  # CloudWatch Log Group for Lambda Function
  DemoFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-func"
      RetentionInDays: 14

  # Main Lambda Function
  DemoFunction:
    Type: AWS::Serverless::Function
    DependsOn: DemoFunctionLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-func"
      CodeUri: target/demo-lambda.jar
      Handler: com.example.demo.handler.StreamLambdaHandler::handleRequest
      Runtime: java21
      Timeout: 60
      MemorySize: 2048
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-func:*"
      Environment:
        Variables:
          STAGE: !Ref Stage
          SPRING_PROFILES_ACTIVE: !Ref Stage
      Events:
        HealthApi:
          Type: Api
          Properties:
            Path: /health
            Method: get
            RestApiId: !Ref DemoApi
        AllPaths:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref DemoApi

  # API Gateway
  DemoApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '{"requestId":"$context.requestId","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","path":"$context.path","status":$context.status,"responseLength":$context.responseLength,"responseTime":$context.responseTime,"xrayTraceId":"$context.xrayTraceId"}'

  # CloudWatch Log Group for API Gateway
  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}-api"
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL for Demo function"
    Value: !Sub "https://${DemoApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/"
    Export:
      Name: !Sub "${AWS::StackName}-ApiUrl-${Stage}"

  DemoFunction:
    Description: "Demo Lambda Function ARN"
    Value: !GetAtt DemoFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DemoFunction-${Stage}"

  HealthEndpoint:
    Description: "Health check endpoint URL"
    Value: !Sub "https://${DemoApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/health"
    Export:
      Name: !Sub "${AWS::StackName}-HealthEndpoint-${Stage}"
