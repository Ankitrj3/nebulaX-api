AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Spring Boot Demo Application on AWS Lambda

Parameters:
  Stage:
    Type: String
    Default: dev
    Description: Stage name for the deployment

Resources:
  # Cognito User Pool
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-user-pool-${Stage}"
      # Allow both username and email for sign-in
      AliasAttributes:
        - email
      # User name requirements: case insensitive
      UsernameConfiguration:
        CaseSensitive: false
      # Required attributes
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: true
          Mutable: true
      # Account recovery settings
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # Auto-verified attributes
      AutoVerifiedAttributes:
        - email
      # Email verification settings
      EmailVerificationMessage: "Your verification code is {####}. Please enter this code to verify your email address."
      EmailVerificationSubject: "Verify your email address"
      # User pool policies
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      # MFA settings: No MFA
      MfaConfiguration: "OFF"
      # Device tracking: Don't remember
      DeviceConfiguration:
        ChallengeRequiredOnNewDevice: false
        DeviceOnlyRememberedOnUserPrompt: false
      # Verification settings
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailMessage: "Your verification code is {####}. Please enter this code to verify your email address."
        EmailSubject: "Verify your email address"
      # Advanced security features
      UserPoolAddOns:
        AdvancedSecurityMode: ENFORCED
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email

  # Cognito User Pool Client
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-app-client-${Stage}"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: true
      # Authentication flows
      ExplicitAuthFlows:
        - ALLOW_USER_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      # Token validity settings
      AuthSessionValidity: 3  # 3 minutes
      RefreshTokenValidity: 5  # 5 days
      AccessTokenValidity: 60  # 60 minutes
      IdTokenValidity: 60      # 60 minutes
      TokenValidityUnits:
        RefreshToken: days
        AccessToken: minutes
        IdToken: minutes
      # Enable token revocation
      EnableTokenRevocation: true
      # Prevent user existence errors
      PreventUserExistenceErrors: ENABLED
      # Supported identity providers
      SupportedIdentityProviders:
        - COGNITO

  # Parameter Store entries for Cognito configuration
  CognitoUserPoolIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/spring-boot-demo/cognito/user-pool-id"
      Type: String
      Value: !Ref CognitoUserPool
      Description: "Cognito User Pool ID for Spring Boot Demo Application"

  CognitoClientIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/spring-boot-demo/cognito/client-id"
      Type: String
      Value: !Ref CognitoUserPoolClient
      Description: "Cognito User Pool Client ID for Spring Boot Demo Application"

  CognitoClientSecretParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/spring-boot-demo/cognito/client-secret"
      Type: String
      Value: !GetAtt CognitoUserPoolClient.ClientSecret
      Description: "Cognito User Pool Client Secret for Spring Boot Demo Application"
      Tier: Standard

  CognitoRegionParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/spring-boot-demo/cognito/region"
      Type: String
      Value: !Ref "AWS::Region"
      Description: "AWS Region for Cognito User Pool"

  # CloudWatch Log Group for Lambda Function
  DemoFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-${Stage}"
      RetentionInDays: 14

  # CloudWatch Log Group for API Gateway
  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}-api-${Stage}"
      RetentionInDays: 14

  # IAM Role for API Gateway CloudWatch Logging
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  # API Gateway Account for CloudWatch Logging
  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  DemoFunction:
    Type: AWS::Serverless::Function
    DependsOn: DemoFunctionLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-${Stage}"
      CodeUri: target/demo-lambda.jar
      Handler: com.example.demo.handler.StreamLambdaHandler::handleRequest
      Runtime: java21
      Timeout: 60
      MemorySize: 2048
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
                - ssm:GetParametersByPath
              Resource: 
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/spring-boot-demo/cognito/*"
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:AdminRespondToAuthChallenge
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:ConfirmForgotPassword
                - cognito-idp:ConfirmSignUp
                - cognito-idp:ForgotPassword
                - cognito-idp:InitiateAuth
                - cognito-idp:ListUsers
                - cognito-idp:ResendConfirmationCode
                - cognito-idp:RespondToAuthChallenge
                - cognito-idp:SignUp
              Resource: 
                - !GetAtt CognitoUserPool.Arn
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-${Stage}:*"
      Environment:
        Variables:
          SPRING_PROFILES_ACTIVE: !Ref Stage
          # Parameter Store paths for secure configuration
          SSM_PARAM_PREFIX: "/spring-boot-demo/cognito"
          # CORS Configuration
          CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:8080"
          CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
          CORS_ALLOWED_HEADERS: "Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers"
          CORS_EXPOSED_HEADERS: "Access-Control-Allow-Origin,Access-Control-Allow-Credentials"
          CORS_ALLOW_CREDENTIALS: "true"
          CORS_MAX_AGE: "3600"
          # Rate Limiting Configuration
          RATE_LIMIT_FORGOT_PASSWORD_LIMIT: "5"
          RATE_LIMIT_FORGOT_PASSWORD_WINDOW: "3600"
          RATE_LIMIT_RESEND_CONFIRMATION_LIMIT: "3"
          RATE_LIMIT_RESEND_CONFIRMATION_WINDOW: "3600"
          # Security Configuration  
          SECURITY_SUSPICIOUS_PATTERNS: ".*\\+.*@.*,.*[0-9]{10,}.*@.*"
          SECURITY_DISPOSABLE_DOMAINS: "10minutemail.com,tempmail.org,guerrillamail.com,mailinator.com,throwaway.email,temp-mail.org,yopmail.com,maildrop.cc,tempail.com"
          # Logging Configuration
          LOG_LEVEL_APP: "INFO"
          LOG_LEVEL_AWS: "WARN"
          LOG_LEVEL_AUTH: "INFO"
          LOG_LEVEL_COGNITO: "INFO"
          LOG_LEVEL_CONTROLLER: "INFO"
      Events:
        ProxyResource:
          Type: Api
          Properties:
            RestApiId: !Ref DemoApi
            Path: /{proxy+}
            Method: ANY
        RootResource:
          Type: Api
          Properties:
            RestApiId: !Ref DemoApi
            Path: /
            Method: ANY

  DemoApi:
    Type: AWS::Serverless::Api
    DependsOn: 
      - ApiGatewayLogGroup
      - ApiGatewayAccount
    Properties:
      Name: !Sub "${AWS::StackName}-api-${Stage}"
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      BinaryMediaTypes:
        - "*/*"
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '{"requestId":"$context.requestId","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","path":"$context.path","resourcePath":"$context.resourcePath","status":$context.status,"responseLength":$context.responseLength,"responseTime":$context.responseTime,"xrayTraceId":"$context.xrayTraceId","integrationRequestId":"$context.integration.requestId","functionResponseStatus":"$context.integration.status","integrationLatency":"$context.integration.latency","integrationServiceStatus":"$context.integration.integrationStatus","ip":"$context.identity.sourceIp","userAgent":"$context.identity.userAgent","principalId":"$context.authorizer.principalId"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true

Outputs:
  # Cognito Resources
  CognitoUserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub "CognitoUserPool-${Stage}"

  CognitoUserPoolClientId:
    Description: "Cognito User Pool Client ID"
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub "CognitoUserPoolClient-${Stage}"

  CognitoUserPoolArn:
    Description: "Cognito User Pool ARN"
    Value: !GetAtt CognitoUserPool.Arn
    Export:
      Name: !Sub "CognitoUserPoolArn-${Stage}"

  # API Resources
  DemoApi:
    Description: "API Gateway endpoint URL for Demo function"
    Value: !Sub "https://${DemoApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/"
    Export:
      Name: !Sub "DemoApi-${Stage}"
  
  DemoFunction:
    Description: "Demo Lambda Function ARN"
    Value: !GetAtt DemoFunction.Arn
    Export:
      Name: !Sub "DemoFunction-${Stage}"

  LambdaLogGroup:
    Description: "Lambda Function CloudWatch Log Group"
    Value: !Ref DemoFunctionLogGroup
    Export:
      Name: !Sub "DemoFunctionLogGroup-${Stage}"

  ApiGatewayLogGroup:
    Description: "API Gateway CloudWatch Log Group"
    Value: !Ref ApiGatewayLogGroup
    Export:
      Name: !Sub "ApiGatewayLogGroup-${Stage}"
