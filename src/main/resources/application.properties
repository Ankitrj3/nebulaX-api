spring.application.name=demo
app.version=1.0.0

# Default profile
spring.profiles.active=local

# AWS Cognito Configuration
aws.cognito.clientId=${AWS_COGNITO_CLIENT_ID:3s2im2cq7m8nb82q41k79rg3v2}
aws.cognito.clientSecret=${AWS_COGNITO_CLIENT_SECRET:10o68m84bvnse7jnccklg98unvncctnm097hijmouor1re7op14m}
aws.cognito.userPoolId=${AWS_COGNITO_USER_POOL_ID:us-east-1_X3grEwPDP}
aws.cognito.region=${AWS_COGNITO_REGION:us-east-1}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:8080}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers}
app.cors.exposed-headers=${CORS_EXPOSED_HEADERS:Access-Control-Allow-Origin,Access-Control-Allow-Credentials}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age=${CORS_MAX_AGE:3600}

# Rate Limiting Configuration
app.rate-limit.forgot-password.limit=${RATE_LIMIT_FORGOT_PASSWORD_LIMIT:5}
app.rate-limit.forgot-password.window-seconds=${RATE_LIMIT_FORGOT_PASSWORD_WINDOW:3600}
app.rate-limit.resend-confirmation.limit=${RATE_LIMIT_RESEND_CONFIRMATION_LIMIT:3}
app.rate-limit.resend-confirmation.window-seconds=${RATE_LIMIT_RESEND_CONFIRMATION_WINDOW:3600}

# Security Configuration
app.security.suspicious-patterns=${SECURITY_SUSPICIOUS_PATTERNS:.*\\+.*@.*,.*[0-9]{10,}.*@.*}
app.security.disposable-domains=${SECURITY_DISPOSABLE_DOMAINS:10minutemail.com,tempmail.org,guerrillamail.com,mailinator.com,throwaway.email,temp-mail.org,yopmail.com,maildrop.cc,tempail.com}

# Logging
logging.level.com.example.demo=${LOG_LEVEL_APP:DEBUG}
logging.level.software.amazon.awssdk=${LOG_LEVEL_AWS:WARN}
logging.level.com.example.demo.util.AuthLogger=${LOG_LEVEL_AUTH:INFO}
logging.level.com.example.demo.service.impl.CognitoServiceImpl=${LOG_LEVEL_COGNITO:INFO}
logging.level.com.example.demo.controller.AuthController=${LOG_LEVEL_CONTROLLER:INFO}
