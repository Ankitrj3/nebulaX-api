# Local development profile
server.port=8080
server.servlet.context-path=

# Logging for development
logging.level.com.example.demo=DEBUG
logging.level.root=INFO
logging.level.software.amazon.awssdk=WARN
logging.level.com.example.demo.util.AuthLogger=INFO
logging.level.com.example.demo.service.impl.CognitoServiceImpl=INFO
logging.level.com.example.demo.controller.AuthController=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Error handling for development
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# Enable detailed error responses
spring.web.resources.add-mappings=true

# Jackson configuration for pretty JSON
spring.jackson.serialization.indent-output=true

# CORS Configuration for local development
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:8080
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers
app.cors.exposed-headers=Access-Control-Allow-Origin,Access-Control-Allow-Credentials
app.cors.allow-credentials=true
app.cors.max-age=3600

# Rate Limiting Configuration (more lenient for local)
app.rate-limit.forgot-password.limit=10
app.rate-limit.forgot-password.window-seconds=3600
app.rate-limit.resend-confirmation.limit=5
app.rate-limit.resend-confirmation.window-seconds=3600

# Security Configuration
app.security.suspicious-patterns=.*\\+.*@.*,.*[0-9]{10,}.*@.*
app.security.disposable-domains=10minutemail.com,tempmail.org,guerrillamail.com,mailinator.com,throwaway.email,temp-mail.org,yopmail.com,maildrop.cc,tempail.com